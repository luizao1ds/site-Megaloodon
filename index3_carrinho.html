<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="container">
        <h1>Lista de Alunos</h1>

        <input type="text" id="nome" placeholder="Digite o Nome">
        <input type="number" id="idade" placeholder="Digite a idade">
        <input type="number" id="nota" placeholder="Digite a nota">

        <button type="button" class="btn" id="btn">Cadastrar</button>

        <h2>Quantidade de Alunos:<span id="quantidade"> 0</span></h2>
       
        
        <table id="tabela">
         <tr>
            <th>Nome</th>
             <th>Idade</th>
             <th>Nota</th>
             <th>Situação</th>
             <th>Ação</th>
         </tr>
        </table>
    </div>

    <script src="script3.js"></script>
</body>
</html>
